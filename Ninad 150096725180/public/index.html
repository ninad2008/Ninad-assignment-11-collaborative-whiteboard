<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Whiteboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="join-screen">
        <div class="join-container">
            <h2>Join Whiteboard</h2>
            <input type="text" id="board-id-input" placeholder="Board ID (e.g., demo)" />
            <input type="text" id="username-input" placeholder="Your Name" />
            <input type="color" id="user-color-input" value="#ff5722" />
            <button id="join-btn">Join Board</button>
        </div>
    </div>

    <div id="board-screen" style="display: none;">
        <div class="toolbar">
            <div class="tool-group">
                <label>Color: <input type="color" id="stroke-color" value="#000000" /></label>
                <label>Size: <input type="range" id="stroke-size" min="1" max="20" value="3" /></label>
            </div>
            <div class="tool-group">
                <button id="undo-btn">Undo</button>
                <button id="clear-btn">Clear Canvas</button>
            </div>
            <div class="tool-group status">
                <span id="room-info"></span>
            </div>
        </div>
        <div class="canvas-container" id="canvas-container">
            <canvas id="whiteboard"></canvas>
            <div id="cursors-layer"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="canvas.js"></script>
</body>
</html>
